<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gallery menu with thumbnail links to each gallery page." />
    <title>Provision Construction LLC Gallery</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="main.js"></script>
  </head>
  <body>
    <div class="top-banner" role="banner" aria-label="Provision Construction LLC phone banner">
      <span class="top-banner-name">Provision Construction LLC</span>
      <a class="top-banner-phone" href="tel:2283273487">228-327-3487</a>
    </div>
    <div class="page-shell">
      <header class="site-header">
        <div class="brand">
          <div>
            <p class="eyebrow">Show Room</p>
            <h1>Provision Construction LLC Gallery</h1>
          </div>
        </div>
        <nav class="site-nav" aria-label="Gallery navigation">
          <a href="index.html">Home</a>
          <a href="gallery-1.html">Bathroom Renovations</a>
          <a href="gallery-2.html">Gallery 2</a>
        </nav>
      </header>

      <main id="content">
        <section class="section" id="gallery-index" aria-labelledby="gallery-title">
          <div class="section-heading reveal">
            <p class="eyebrow">Show Room</p>
            <h3 id="gallery-title">Choose a gallery</h3>
          </div>

          <div class="gallery-grid gallery-index-grid reveal delay-1" aria-label="Gallery folder thumbnails">
            <article class="gallery-card gallery-index-card">
              <a class="gallery-thumb-link" href="gallery-1.html" aria-label="Open Bathroom Renovations">
                <img class="gallery-image" src="staging/bathroom-remodel-demo/bathroom-remodel-demo-001.webp" alt="Bathroom remodel demo thumbnail" />
              </a>
              <h4>Bathroom Renovations</h4>
              <p>Bathroom Remodel Demo</p>
            </article>
            <article class="gallery-card gallery-index-card">
              <a class="gallery-thumb-link" href="gallery-2.html" aria-label="Open Gallery 2">
                <img class="gallery-image" src="staging/ai-images-kitchen-remodel/ai-images-kitchen-remodel-001.webp" alt="Kitchen remodel thumbnail" />
              </a>
              <h4>Gallery 2</h4>
              <p>Kitchen Remodel</p>
            </article>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p>Gallery menu • Provision Construction LLC</p>
      </footer>
    </div>
  </body>
</html>
